# --- Oberfläche -----------------------------------------------------------

lvgl:
  displays: main_display
  touchscreens: main_touch
  buffer_size: 25%
  pages:
    - id: page_music
      bg_color: 0x000000
      widgets:
        # Cover als Hintergrund
        - image:
            id: img_cover
            src: cover_img
            align: CENTER
            hidden: true
        # Dunkle Ebene darüber, damit der Text lesbar bleibt
