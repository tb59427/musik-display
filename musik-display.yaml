# --- Schriften (mit Umlauten!) --------------------------------------------

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 24
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 38
    bpp: 4
    glyphsets: [GF_Latin_Core]

  # Uhr und große Temperatur: nur die nötigen Zeichen, spart Speicher
  - file: "gfonts://Roboto@700"
    id: font_clock
    size: 88
    bpp: 4
    glyphs: "0123456789:"
  - file: "gfonts://Roboto@300"
    id: font_temp
    size: 72
    bpp: 4
    glyphs: "0123456789-°"
