            align: CENTER
            width: 480
            height: 480
            radius: 0
            border_width: 0
            pad_all: 0
            bg_color: 0x000000
            bg_opa: 55%
        - label:
            id: lbl_source
            align: TOP_MID
            y: 30
            width: 440
            long_mode: WRAP
            text_align: CENTER
            text: "Warte auf HA …"
            text_font: font_small
