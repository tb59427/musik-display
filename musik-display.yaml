sensor:
  # freier Speicher, um Lecks zu erkennen
  - platform: debug
    free:
      name: Freier Heap
    block:
      name: Größter freier Block
    psram:
      name: Freies PSRAM

  # aktuelle Temperatur (METAR, sonst Wetterdienst) aus dem Vorhersage-Sensor
  - platform: homeassistant
    id: w_now_temp
    entity_id: ${forecast_sensor}
    attribute: jetzt_temp
    on_value:
      - lvgl.label.update:
          id: lbl_now_temp
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°", x);
            return std::string(buf);

  # Zielhelligkeit für die Wetterseite in Prozent (aus HA)
  - platform: homeassistant
    id: display_hell
    entity_id: ${helligkeit_sensor}
    on_value:
      - if:
          condition:
            lambda: 'return id(last_mode) == 2 && !id(wake).is_running();'
          then:
            - script.execute: apply_brightness

binary_sensor:
  # läuft im Raum dieses Displays einer der eingetragenen Raumplayer?
  - platform: homeassistant
    id: raum_aktiv
    entity_id: ${raum_sensor}
    on_state:
      - script.execute: set_mode