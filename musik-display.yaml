# ESPHome-Konfiguration: Guition ESP32-S3-4848S040 (4", 480x480) als Musik-Anzeige
# Nutzt dieselben Entities wie die button-card im Dashboard.

substitutions:
  name: musik-display
  friendly_name: Musik-Display
  # Music-Assistant-Player der Masterlink-Bridge (liefert Zustand, Titel, Interpret)
  ma_player: media_player.masterlink_bridge_ma
  # Template-Sensoren für die Kopfzeile, wie in der Dashboard-Karte
  quelle_sensor: sensor.n_music_quelle
  inhalt_sensor: sensor.n_music_inhalt
  # Template-Sensor mit der Logo-URL des laufenden Senders
  logo_sensor: sensor.n_music_logo
  # Anzeige-Sensor mit derselben Logik wie die Dashboard-Karte (ha/musik-display-sensor.yaml)
  anzeige_sensor: sensor.musik_display
  # Ist im Raum dieses Displays einer der Raumplayer an? (ha/raum-aktiv.yaml)
  raum_sensor: binary_sensor.musik_display_raum_aktiv
  # Wetter: Quelle für die aktuelle Temperatur und aufbereitete Vorhersage
  # (Vorhersage-Sensor siehe ha/wetter-vorhersage.yaml)
  weather_entity: sensor.wetter_daily
  forecast_sensor: sensor.wetter_vorhersage_display
  # Home Assistant im LAN: externe Cover werden über HA geladen (spart TLS-Speicher am Display).
  # IP-Adresse statt .local, der ESP32 löst mDNS-Namen hier nicht auf.
  ha_url: "http://192.168.1.10:8123"
  # Helligkeit der Wetterseite tagsüber und Nachtruhe (Display aus)
  helligkeit_wetter: "70%"
  # Bei laufender Musik per Antippen aufgerufene Wetterseite: Rückkehr zur Musik nach
  wetter_anzeigedauer: 30s
  # Zielhelligkeit aus HA (Raumlicht bzw. Sonnenstand), siehe ha/display-helligkeit.yaml
  helligkeit_sensor: sensor.display_helligkeit
  nacht_von: "23"
  nacht_bis: "6"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      # Bilder dekodieren dauert teils mehrere Sekunden -> Watchdog nicht zu früh auslösen
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"
      # Verschlüsselung (HTTPS) und Bild-Decoder ins PSRAM statt in den knappen internen Speicher
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback-Hotspot, falls das WLAN nicht erreichbar ist
  ap:
    ssid: "Musik-Display Fallback"
    password: !secret fallback_ap_password

# Webseite im Fallback-Hotspot zum Eintragen der WLAN-Zugangsdaten
captive_portal:

# Diagnose: Neustartgrund und freier Speicher (in HA sichtbar)
debug:
  update_interval: 30s

# Die Liste der Raumplayer liegt in HA (input_text, siehe ha/raum-aktiv.yaml),
# das Display liest nur das Ergebnis (raum_sensor).

# --- Hardware -------------------------------------------------------------

# SPI nur für die Init-Sequenz des ST7701S-Controllers
spi:
  clk_pin: GPIO48
  mosi_pin: GPIO47

# Touch-Controller GT911
i2c:
  sda: GPIO19
  scl: GPIO45

display:
  - platform: mipi_rgb
    model: GUITION-4848S040
    id: main_display
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display
    # Antippen: bei Musik zwischen Musik- und Wetterseite umschalten,
    # sonst 60 s volle Helligkeit (auch nachts)
    on_touch:
      - script.execute: touch_action

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_out

light:
  # Nur intern: Helligkeit und Nachtruhe regelt das Display selbst. Als Licht in
  # HA würde es sonst von Bereichsaktionen ("alle Lichter im Wohnzimmer aus")
  # mitgeschaltet.
  - platform: monochromatic
    name: Hintergrundbeleuchtung
    id: backlight
    internal: true
    output: backlight_out
    restore_mode: ALWAYS_ON
    # ohne Gammakorrektur entspricht der Prozentwert der tatsächlichen Helligkeit
    gamma_correct: 1.0

# --- Uhrzeit aus Home Assistant -------------------------------------------

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Berlin
    on_time_sync:
      - script.execute: update_clock
    on_time:
      # jede volle Minute
      - seconds: 0
        then:
          - script.execute: update_clock
          - script.execute: set_mode
      # Vorbeugender Neustart nachts um 4 Uhr, sofern keine Musik läuft
      - seconds: 0
        minutes: 0
        hours: 4
        then:
          - if:
              condition:
                lambda: 'return id(ma_state).state != "playing";'
              then:
                - logger.log: "Nächtlicher Neustart"
                - lambda: 'App.safe_reboot();'


# --- Selbstheilung ----------------------------------------------------------

interval:
  # Hängt ein Bild-Download länger als 90 s, wird er verworfen und neu versucht.
  # Passiert das zweimal hintereinander, startet das Display neu.
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(img_busy) && (millis() - id(busy_since)) > 90000;'
          then:
            - lambda: |-
                id(stuck_count)++;
                ESP_LOGW("bild", "Download hängt seit über 90 s (Nr. %d), setze zurück", id(stuck_count));
                id(img_busy) = false;
                id(shown_url) = "";
                if (id(stuck_count) >= 2) {
                  ESP_LOGW("bild", "Download hängt wiederholt, Neustart");
                  App.safe_reboot();
                }
            - script.execute: process_picture

# --- Album-Cover ----------------------------------------------------------

http_request:
  verify_ssl: false
  # HA lädt externe Cover erst selbst herunter, bevor es antwortet -> mehr Geduld
  timeout: 20s
  watchdog_timeout: 30s

online_image:
  # Cover als JPEG (MA liefert über seinen Imageproxy auf Wunsch immer JPEG)
  - id: cover_img
    url: "http://127.0.0.1/cover.jpg"
    format: JPEG
    type: RGB565
    resize: 480x480
    update_interval: never
    on_download_finished:
      - lambda: 'id(img_busy) = false; id(stuck_count) = 0;'
      # nur anzeigen, wenn das Bild noch gewünscht ist (Quelle nicht inzwischen gewechselt)
      - if:
          condition:
            lambda: 'return id(pending_url) == id(target_key);'
          then:
            - lvgl.image.update:
                id: img_cover
                src: cover_img
            - lvgl.widget.show: img_cover
            - lambda: 'id(shown_url) = id(pending_url); id(shown_kind) = 1;'
          else:
            - logger.log: "Bild veraltet, wird nicht angezeigt"
    on_error:
      - logger.log:
          format: "Cover (JPEG) konnte nicht geladen werden (%s), versuche Senderlogo"
          args: ['id(target_url).c_str()']
      - lambda: 'id(img_busy) = false; id(shown_url) = ""; id(shown_kind) = 0;'
      - delay: 1500ms
      - wait_until:
          condition:
            lambda: 'return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT) > 30000;'
          timeout: 20s
      - script.execute: load_station_logo
  # Fallback für PNG-Logos, die nicht über den MA-Imageproxy kommen
  - id: cover_png
    url: "http://127.0.0.1/cover.png"
    format: PNG
    type: RGB565
    resize: 480x480
    update_interval: never
    on_download_finished:
      - lambda: 'id(img_busy) = false; id(stuck_count) = 0;'
      # nur anzeigen, wenn das Bild noch gewünscht ist (Quelle nicht inzwischen gewechselt)
      - if:
          condition:
            lambda: 'return id(pending_url) == id(target_key);'
          then:
            - lvgl.image.update:
                id: img_cover
                src: cover_png
            - lvgl.widget.show: img_cover
            - lambda: 'id(shown_url) = id(pending_url); id(shown_kind) = 2;'
          else:
            - logger.log: "Bild veraltet, wird nicht angezeigt"
    on_error:
      - logger.log: "Cover (PNG) konnte nicht geladen werden, versuche Senderlogo"
      - lambda: 'id(img_busy) = false; id(shown_url) = ""; id(shown_kind) = 0;'
      - delay: 1500ms
      - wait_until:
          condition:
            lambda: 'return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT) > 30000;'
          timeout: 20s
      - script.execute: load_station_logo
  # Senderlogos aus sensor.n_music_logo (JPG oder PNG)
  - id: logo_jpg
    url: "http://127.0.0.1/logo.jpg"
    format: JPEG
    type: RGB565
    resize: 480x480
    update_interval: never
    on_download_finished:
      - lambda: 'id(img_busy) = false; id(stuck_count) = 0;'
      # nur anzeigen, wenn das Bild noch gewünscht ist (Quelle nicht inzwischen gewechselt)
      - if:
          condition:
            lambda: 'return id(pending_url) == id(target_key);'
          then:
            - lvgl.image.update:
                id: img_cover
                src: logo_jpg
            - lvgl.widget.show: img_cover
            - lambda: 'id(shown_url) = id(pending_url); id(shown_kind) = 3;'
          else:
            - logger.log: "Bild veraltet, wird nicht angezeigt"
    on_error:
      - logger.log: "Senderlogo (JPG) konnte nicht geladen werden"
      - lambda: 'id(img_busy) = false; id(shown_url) = ""; id(shown_kind) = 0;'
      - lvgl.widget.hide: img_cover
  - id: logo_png
    url: "http://127.0.0.1/logo.png"
    format: PNG
    type: RGB565
    resize: 480x480
    update_interval: never
    on_download_finished:
      - lambda: 'id(img_busy) = false; id(stuck_count) = 0;'
      # nur anzeigen, wenn das Bild noch gewünscht ist (Quelle nicht inzwischen gewechselt)
      - if:
          condition:
            lambda: 'return id(pending_url) == id(target_key);'
          then:
            - lvgl.image.update:
                id: img_cover
                src: logo_png
            - lvgl.widget.show: img_cover
            - lambda: 'id(shown_url) = id(pending_url); id(shown_kind) = 4;'
          else:
            - logger.log: "Bild veraltet, wird nicht angezeigt"
    on_error:
      - logger.log: "Senderlogo (PNG) konnte nicht geladen werden"
      - lambda: 'id(img_busy) = false; id(shown_url) = ""; id(shown_kind) = 0;'
      - lvgl.widget.hide: img_cover

